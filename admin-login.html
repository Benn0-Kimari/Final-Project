<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | IT HelpDesk</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">

<header class="navbar">
    <a href="index.html" class="logo"><span>IT</span> HelpDesk</a>
    <nav>
        <a href="index.html">Home</a>
        <a href="login.html">Employee Login</a>
    </nav>
</header>

<main class="auth-container">
    <section class="auth-card">
        <div class="auth-icon">🛡️</div>
        <span class="page-label">RESTRICTED ACCESS</span>
        <h1>IT Admin Portal</h1>
        <p class="auth-subtitle">Sign in with administrator credentials to manage ticket queues.</p>

        <form id="adminLoginForm" class="auth-form" onsubmit="return false;">
            <div class="form-group">
                <label for="adminEmail">Admin Email</label>
                <input type="email" id="adminEmail" placeholder="admin@company.com" required>
            </div>

            <div class="form-group">
                <label for="adminPassword">Password</label>
                <input type="password" id="adminPassword" placeholder="Enter admin password" required>
            </div>

            <div id="adminLoginMessage" class="form-message" hidden></div>

            <button type="submit" class="primary-btn auth-submit" style="background-color: #e74c3c;">Login as Admin</button>
        </form>

        <p class="auth-footer">
            <small>Default credentials: <strong>admin@company.com</strong> / <strong>admin123</strong></small>
        </p>

        <a href="index.html" class="back-link">← Back to Home</a>
    </section>
</main>

<script src="js/script.js"></script>
</body>
</html>
