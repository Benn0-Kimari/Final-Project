<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Dashboard | IT HelpDesk</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

<header class="navbar">
    <div class="logo">IT HelpDesk</div>

    <nav>
        <a href="dashboard.html">Dashboard</a>
        <a href="create-ticket.html">Report Fault</a>
        <a href="tickets.html">My Tickets</a>
        <a href="../index.html">Home</a>
    </nav>

    <button onclick="logout()" class="logout-btn">Logout</button>
</header>

<main class="dashboard-container">

    <div class="dashboard-header">
        <div>
            <h1>Employee Dashboard</h1>
            <p>Welcome back, <span id="userName">Employee</span>.</p>
        </div>

        <a href="create-ticket.html" class="primary-btn">
            + Report a Problem
        </a>
    </div>

    <section class="stats-grid">

        <div class="stat-card">
            <h3>Total Tickets</h3>
            <p id="totalTickets">0</p>
        </div>

        <div class="stat-card">
            <h3>Open Tickets</h3>
            <p id="openTickets">0</p>
        </div>

        <div class="stat-card">
            <h3>In Progress</h3>
            <p id="progressTickets">0</p>
        </div>

        <div class="stat-card">
            <h3>Resolved</h3>
            <p id="resolvedTickets">0</p>
        </div>

    </section>

    <section class="dashboard-section">

        <div class="section-header">
            <h2>Recent Tickets</h2>
            <a href="tickets.html">View All</a>
        </div>

        <div id="recentTickets" class="ticket-list">
            <p>No tickets submitted yet.</p>
        </div>

    </section>

</main>

<script src="../js/script.js"></script>

</body>
</html>
