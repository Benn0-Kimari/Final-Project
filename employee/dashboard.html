<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | IT HelpDesk</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="navbar">
    <a href="index.html" class="logo"><span>IT</span> HelpDesk <small>(Admin)</small></a>
    <nav>
        <a href="admin-dashboard.html">All Tickets</a>
    </nav>
    <div class="nav-buttons">
        <button onclick="adminLogout()" class="secondary-btn">Sign Out</button>
    </div>
</header>

<main class="dashboard-container" style="padding: 30px;">
    <h1>System Ticket Management</h1>
    
    <div class="stats-grid" style="display: flex; gap: 20px; margin: 20px 0;">
        <div class="stat-card" style="padding: 15px; border: 1px solid #ccc; flex: 1;">
            <h3>Total Tickets</h3>
            <p class="stat-number" style="font-size: 24px; font-weight: bold;">0</p>
        </div>
        <div class="stat-card border-yellow" style="padding: 15px; border: 1px solid #ccc; flex: 1;">
            <h3>New</h3>
            <p class="stat-number" style="font-size: 24px; font-weight: bold;">0</p>
        </div>
        <div class="stat-card border-blue" style="padding: 15px; border: 1px solid #ccc; flex: 1;">
            <h3>In Progress</h3>
            <p class="stat-number" style="font-size: 24px; font-weight: bold;">0</p>
        </div>
        <div class="stat-card border-green" style="padding: 15px; border: 1px solid #ccc; flex: 1;">
            <h3>Resolved</h3>
            <p class="stat-number" style="font-size: 24px; font-weight: bold;">0</p>
        </div>
    </div>

    <table class="ticket-table" style="width: 100%; border-collapse: collapse; text-align: left;">
        <thead>
            <tr style="background-color: #f4f4f4;">
                <th>ID</th>
                <th>User</th>
                <th>Category</th>
                <th>Title / Description</th>
                <th>Priority</th>
                <th>Assigned Tech</th>
                <th>Status</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="ticketTableBody">
            <!-- Dynamically populated by loadAdminTickets() in script.js -->
        </tbody>
    </table>
</main>

<script src="js/script.js"></script>
</body>
</html>
