<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | IT HelpDesk</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">

<header class="navbar">
    <a href="index.html" class="logo"><span>IT</span> HelpDesk</a>
    <nav>
        <a href="index.html">Home</a>
        <a href="index.html#services">Services</a>
        <a href="index.html#how-it-works">How It Works</a>
        <a href="index.html#about">About</a>
    </nav>
    <div class="nav-buttons">
        <a href="login.html" class="secondary-btn">Sign In</a>
    </div>
</header>

<main class="auth-container">
    <section class="auth-card">
        <div class="auth-icon">👤</div>
        <span class="page-label">NEW USER</span>
        <h1>Create Your Account</h1>
        <p class="auth-subtitle">Create an employee account to submit and track IT support tickets.</p>

        <form id="registerForm" class="auth-form">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" maxlength="80" placeholder="e.g. Benard Kimari" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="you@example.com" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" minlength="6" placeholder="At least 6 characters" required>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" minlength="6" placeholder="Repeat your password" required>
            </div>

            <div id="registerMessage" class="form-message" hidden></div>

            <button type="submit" class="primary-btn auth-submit">Create Account</button>
        </form>

        <p class="auth-footer">
            Already have an account?
            <a href="login.html">Sign in</a>
        </p>

        <a href="index.html" class="back-link">← Back to Home</a>
    </section>
</main>

<script src="js/script.js"></script>
</body>
</html>
